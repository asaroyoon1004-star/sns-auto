<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>1分でわかるお金の話｜リンク集</title>
<style>
:root{--bg:#f6f7f9;--fg:#14181f;--card:#fff;--mute:#5b6472;--accent:#1b6b5f}
@media (prefers-color-scheme:dark){:root{--bg:#0f1216;--fg:#eef1f5;--card:#1a1f26;--mute:#9aa4b2;--accent:#5cc8b0}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
main{max-width:520px;margin:0 auto;padding:32px 16px 48px}
h1{font-size:22px;margin:0 0 6px} .sub{color:var(--mute);font-size:14px;margin:0 0 20px}
.card{display:flex;align-items:center;gap:10px;background:var(--card);color:var(--fg);text-decoration:none;
padding:16px;border-radius:14px;margin:10px 0;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.pr{font-size:11px;border:1px solid var(--mute);color:var(--mute);border-radius:4px;padding:1px 5px}
.arrow{margin-left:auto;color:var(--accent);font-size:22px}
.note{color:var(--mute);font-size:12px;line-height:1.7;margin-top:28px} .empty{color:var(--mute)}
</style></head><body><main>
<h1>1分でわかるお金の話</h1><p class="sub">動画で紹介したサービスのリンク集</p>
<p class="empty">リンクは準備中です。</p>
<p class="note">当ページはアフィリエイト広告（PR）を含みます。紹介リンクから申込みがあった場合、運営者が報酬を受け取ることがあります。投資・保険・金融商品の選択はご自身の判断でお願いします。</p>
</main></body></html>
