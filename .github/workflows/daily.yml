name: daily-shorts
on:
  schedule:
    - cron: "0 22 * * *"   # 07:00 JST
    - cron: "0 3 * * *"    # 12:00 JST
    - cron: "0 11 * * *"   # 20:00 JST
  workflow_dispatch:
    inputs:
      seed_id:
        description: "再投稿したい台本ID（例: s011 = 72の法則）。空なら通常どおり次の台本"
        required: false
        default: ""
permissions:
  contents: write
concurrency: { group: sns-pipeline, cancel-in-progress: false }
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - run: pip install -r requirements.txt
      - name: make + publish
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          SEED_ID: ${{ github.event.inputs.seed_id }}
        run: python -m sns.pipeline daily ${SEED_ID:+--seed-id "$SEED_ID"}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "videos-${{ github.run_id }}", path: "data/queue/*/video.mp4", retention-days: 14, if-no-files-found: ignore }
      - name: save state
        if: always()
        run: |
          git config user.name "sns-bot"
          git config user.email "sns-bot@users.noreply.github.com"
          git add data config.json
          git diff --cached --quiet || git commit -m "auto: new short $(date -u +%F-%H%M)"
          for i in 1 2 3 4; do git pull -q --rebase -X theirs origin main && git push && break; sleep $((i*3)); done
