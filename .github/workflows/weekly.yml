name: weekly-analyze
on:
  schedule:
    - cron: "0 20 * * *"    # daily 05:00 JST
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: sns-pipeline, cancel-in-progress: false }
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install requests
      - name: stats -> weights -> report -> landing page
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: |
          python -m sns.pipeline analyze
          python -m sns.pipeline landing
      - name: save state
        run: |
          git config user.name "sns-bot"
          git config user.email "sns-bot@users.noreply.github.com"
          git add data docs config.json
          git diff --cached --quiet || git commit -m "auto: weekly analysis $(date -u +%F)"
          git push
